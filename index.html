<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breaking News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- SVG sprite -- all icons defined once, referenced by id below -->
<svg style="display:none;" xmlns="http://www.w3.org/2000/svg">

  <symbol id="icon-gear" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </symbol>

  <symbol id="icon-eye" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="12" rx="10" ry="6"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>

  <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="12" rx="10" ry="6"/>
    <circle cx="12" cy="12" r="3"/>
    <line x1="2" y1="2" x2="22" y2="22"/>
  </symbol>

</svg>

<div class="shell">

  <header>
    <div class="header-left">
      <img src="breaking-news-dark.png" alt="Breaking News" />
      <span class="header-title">Breaking News<span class="header-guys">Guys</span></span>
    </div>
    <div class="header-right">
      <span id="status-text"></span>
      <span class="heartbeat-tick" id="heartbeat-tick">&#9829;</span>
      <div class="dot" id="dot"></div>
      <button class="gear-btn" id="gear-btn" onclick="toggleSettings()" title="Settings">
        <svg class="gear-icon"><use href="#icon-gear"/></svg>
        <span class="gear-arrow" id="gear-arrow">&#x25BC;</span>
      </button>
    </div>
  </header>

  <div class="settings-panel" id="settings-panel">
    <div class="key-form">
      <div class="key-input-wrap">
        <input
          type="password"
          id="api-key-input"
          placeholder="API key"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="eye-btn" id="eye-btn" onclick="toggleKeyVisibility()" title="Show / hide key" tabindex="-1">
          <svg id="eye-icon" class="ui-icon"><use href="#icon-eye"/></svg>
          <svg id="eye-off-icon" class="ui-icon" style="display:none"><use href="#icon-eye-off"/></svg>
        </button>
      </div>
      <button id="connect-btn" onclick="handleConnect()">Connect</button>
    </div>
  </div>

  <div class="feed-header" id="feed-header"></div>
  <div class="feed" id="feed">
    <div class="feed-empty" id="feed-empty">&mdash; no messages &mdash;</div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
